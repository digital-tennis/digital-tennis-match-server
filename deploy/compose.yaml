services:
  match:
    build: ..
    restart: unless-stopped
    expose: ["8080"]
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      match:
        condition: service_healthy
    environment:
      TENNIS_DOMAIN: ${TENNIS_DOMAIN:?Set your owned DNS domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
